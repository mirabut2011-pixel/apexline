  --pink: #ff2e88; --cyan: #22d3ee; --orange: #ff9f1c; --gold: #ffc93c; --lime: #a3e635; --violet: #8b5cf6; --purple: #b06bff; --red: #ff4d5e; --mint: #2ee6a6;
  --grad-hot: linear-gradient(135deg, #ff9f1c 0%, #ff2e88 55%, #b06bff 100%);
  --grad-cool: linear-gradient(135deg, #22d3ee 0%, #6366f1 60%, #b06bff 100%);
  --grad-gold: linear-gradient(135deg, #ffe17a 0%, #ffc93c 40%, #ff9f1c 100%);
  --grad-lime: linear-gradient(135deg, #d9f99d 0%, #a3e635 50%, #2ee6a6 100%);
  --r: 18px; --r-sm: 12px; --r-lg: 26px;
  --display: 'Apex Display', 'Arial Narrow', sans-serif; --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --side: 240px;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg0); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::selection { background: rgba(255,46,136,0.4); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
* { scrollbar-width: thin; scrollbar-color: rgba(176,107,255,0.4) transparent; }

.display { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; letter-spacing: 0.01em; line-height: 0.92; text-transform: uppercase; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.grad-text { background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grad-text.cool { background: var(--grad-cool); -webkit-background-clip: text; background-clip: text; }
.grad-text.gold { background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; }

/* ── background */
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bgfx canvas { width: 100%; height: 100%; display: block; }

/* ── logo */
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--text); }
.logo-mark { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 10px rgba(255,46,136,0.5)); }
.logo-word { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 28px; letter-spacing: 0.03em; }
.logo-word b { font-weight: 900; background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── shell */
.app { position: fixed; inset: 0; display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: auto 1fr; padding-top: var(--safe-t); }
.app.bare { display: block; }
.side { grid-row: 1 / 3; position: relative; z-index: 10; display: flex; flex-direction: column; padding: 18px 14px; background: linear-gradient(180deg, rgba(18,10,51,0.88), rgba(10,6,32,0.92)); border-right: 1px solid var(--line); backdrop-filter: blur(18px); overflow-y: auto; }
.side .logo { padding: 6px 8px 18px; }
.nav-group { margin-top: 10px; }
.nav-group > .eyebrow { padding: 8px 12px 6px; font-size: 10px; color: var(--dim); }
.nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; transition: background .2s, color .2s, transform .2s var(--ease); }
.nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); transform: translateX(2px); }
.nav-item.on { color: #fff; background: linear-gradient(90deg, var(--acc-a, rgba(255,46,136,0.28)), rgba(255,255,255,0.02)); box-shadow: inset 3px 0 0 var(--acc, var(--pink)); }
.nav-item .ni-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--acc, var(--pink)); flex: none; transition: background .2s, box-shadow .2s; }
.nav-item.on .ni-icon { background: var(--acc, var(--pink)); color: #140a30; box-shadow: 0 0 18px var(--acc, var(--pink)); }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 12px rgba(255,46,136,0.7); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.side-foot { margin-top: auto; padding-top: 14px; }
.side-play { width: 100%; }

.topbar { position: relative; z-index: 9; display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 24px; background: linear-gradient(180deg, rgba(10,6,32,0.75), rgba(10,6,32,0.35)); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
.topbar .spacer { flex: 1; }
.player-chip { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.player-chip .pc-name { font-weight: 800; font-size: 15px; line-height: 1.1; }
.player-chip .pc-sub { font-size: 12px; color: var(--muted); }
.xpbar { width: 140px; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: var(--grad-lime); border-radius: 4px; }
.res { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 8px; border-radius: 999px; background: rgba(0,0,0,0.3); border: 1px solid var(--line2); font-weight: 800; font-size: 14px; }
.res .ri { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.res.gold .ri { background: rgba(255,201,60,0.18); }
.res.violet .ri { background: rgba(176,107,255,0.22); color: var(--purple); }
.res.cloud { padding: 0 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.res.cloud .dot { width: 8px; height: 8px; border-radius: 50%; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.06); border: 1px solid var(--line); transition: background .2s, transform .2s var(--spring); }
.icon-btn:hover { background: rgba(255,255,255,0.12); transform: rotate(20deg); }

.content { position: relative; z-index: 1; overflow-y: auto; overflow-x: hidden; }
.screen { animation: screenIn .55s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(0.995); } to { opacity: 1; transform: none; } }
.page { max-width: 1400px; margin: 0 auto; padding: 28px 28px 90px; }
.stagger > * { animation: rise .6s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .05s; } .stagger > *:nth-child(3) { animation-delay: .1s; } .stagger > *:nth-child(4) { animation-delay: .15s; }
.stagger > *:nth-child(5) { animation-delay: .2s; } .stagger > *:nth-child(6) { animation-delay: .25s; } .stagger > *:nth-child(7) { animation-delay: .3s; } .stagger > *:nth-child(8) { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.bottomnav, .more-sheet { display: none; }

/* ── section head */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; }
.sh-left { display: flex; align-items: center; gap: 16px; }
.sh-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #140a30; background: var(--acc); box-shadow: 0 10px 30px -6px var(--acc), inset 0 2px 0 rgba(255,255,255,0.4); flex: none; }
.section-head h1 { font-size: clamp(40px, 5vw, 64px); margin: 2px 0 0; text-shadow: 0 6px 30px rgba(0,0,0,0.4); }
.sh-sub { margin: 6px 0 0; color: var(--muted); max-width: 640px; }

/* ── buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 46px; padding: 0 22px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(255,255,255,0.06); font-weight: 700; font-size: 14px; letter-spacing: 0.01em; white-space: nowrap; transition: transform .18s var(--spring), background .2s, border-color .2s, box-shadow .2s, filter .2s; overflow: hidden; }
.btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.hot { background: var(--grad-hot); border-color: transparent; color: #fff; box-shadow: 0 10px 30px -10px rgba(255,46,136,0.9), inset 0 1px 0 rgba(255,255,255,0.35); }
.btn.hot:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 14px 36px -10px rgba(255,46,136,1), inset 0 1px 0 rgba(255,255,255,0.35); }
.btn.cool { background: var(--grad-cool); border-color: transparent; color: #fff; box-shadow: 0 10px 30px -12px rgba(34,211,238,0.9); }
.btn.gold { background: var(--grad-gold); border-color: transparent; color: #3a2200; box-shadow: 0 10px 30px -12px rgba(255,201,60,0.9); }
.btn.lime { background: var(--grad-lime); border-color: transparent; color: #0e2a05; box-shadow: 0 10px 30px -12px rgba(163,230,53,0.9); }
.btn.primary { background: #fff; color: #140a30; border-color: transparent; }
.btn.danger { border-color: rgba(255,77,94,0.5); color: #ff8c97; }
.btn.danger.solid { background: var(--red); color: #fff; border-color: transparent; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.05); }
.btn.lg { height: 58px; padding: 0 30px; font-size: 16px; border-radius: 16px; }
.btn.xl { height: 76px; padding: 0 46px; border-radius: 20px; font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; }
.btn.block { width: 100%; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 11px; }
.btn.xs { height: 30px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
.btn.shine::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent); transform: skewX(-20deg); animation: shine 3.2s infinite; }
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }

.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.08); color: var(--muted); white-space: nowrap; }
.tag.demo { background: rgba(176,107,255,0.18); color: #d4b5ff; }
.tag.soon { background: rgba(255,159,28,0.16); color: var(--orange); }
.tag.ok { background: rgba(163,230,53,0.16); color: var(--lime); }
.tag.ai { background: rgba(255,255,255,0.1); color: #d6d2ee; }
.tag.draft { background: rgba(255,77,94,0.14); color: #ff8c97; }
.tag.hot { background: var(--grad-hot); color: #fff; }
.tag.new { background: var(--cyan); color: #06222a; }

/* ── cards */
.card { position: relative; border-radius: var(--r); background: linear-gradient(160deg, rgba(48,28,110,0.55), rgba(20,12,52,0.65)); border: 1px solid var(--line); padding: 20px; backdrop-filter: blur(16px); box-shadow: 0 20px 50px -30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06); overflow: hidden; }
.card.acc { --acc: var(--pink); }
.card.acc::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(140deg, var(--acc), transparent 45%, transparent 70%, var(--acc)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.6; pointer-events: none; }
.card.acc::after { content: ''; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; background: radial-gradient(circle, var(--acc), transparent 65%); opacity: 0.22; pointer-events: none; }
.card.hover { transition: transform .3s var(--ease), box-shadow .3s; cursor: pointer; }
.card.hover:hover { transform: translateY(-4px); box-shadow: 0 28px 60px -28px var(--acc, rgba(255,46,136,0.8)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; position: relative; z-index: 1; }
.card-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.card-head .ch-l { display: flex; align-items: center; gap: 10px; }
.chi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--acc, var(--pink)); color: #140a30; box-shadow: 0 0 16px var(--acc, var(--pink)); flex: none; }
.card > * { position: relative; z-index: 1; }
.grid { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

.progress { position: relative; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
.progress i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--grad-hot); transition: width .8s var(--ease); box-shadow: 0 0 12px rgba(255,46,136,0.5); }

.rchips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 8px; background: rgba(0,0,0,0.28); border: 1px solid var(--line); font-size: 12px; font-weight: 700; }
.rchips.small .rchip { height: 22px; font-size: 11px; padding: 0 7px; }
.rchip.gold { color: var(--gold); } .rchip.lime { color: var(--lime); } .rchip.violet { color: #d4b5ff; }
.pdot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.3); }
.coin { flex: none; filter: drop-shadow(0 0 6px rgba(255,201,60,0.5)); }
.booster-art { display: grid; place-items: center; border-radius: 14px; color: #140a30; flex: none; }
.crate-art { flex: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
.crate-art.shake { animation: shake .5s infinite; }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.05); } 75% { transform: rotate(6deg) scale(1.05); } }
.avatar { position: relative; border-radius: 50%; display: grid; place-items: center; color: #140a30; flex: none; }
.avatar-ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); }
.countdown-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 9px; background: rgba(0,0,0,0.35); border: 1px solid var(--line2); font-size: 12px; font-weight: 700; color: #fff; }

/* ── forms */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(0,0,0,0.3); outline: none; transition: border-color .2s, box-shadow .2s; }
.input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.2); }
textarea.input { height: 120px; padding: 12px 14px; resize: vertical; }
select.input option { background: #1b1147; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 10px 0; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--pink); width: 16px; height: 16px; flex: none; }
.err { color: #ff8c97; font-size: 13px; margin: 8px 0; }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); flex-wrap: wrap; gap: 2px; }
.seg button { background: none; border: 0; height: 36px; padding: 0 16px; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 13px; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--grad-hot); color: #fff; box-shadow: 0 6px 18px -6px rgba(255,46,136,0.8); }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }
.switch { position: relative; width: 46px; height: 27px; flex: none; border-radius: 999px; background: rgba(255,255,255,0.14); border: 0; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .25s var(--spring); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.switch.on { background: linear-gradient(90deg, var(--pink), var(--purple)); }
.switch.on::after { transform: translateX(19px); }
.switch:disabled { opacity: 0.55; cursor: not-allowed; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .t { font-weight: 700; }
.setting .d { font-size: 13px; color: var(--muted); }

.stat { margin: 10px 0; }
.stat .l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.stat .l b { color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 13px; }
.bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--grad-cool); border-radius: 6px; transition: width .6s var(--ease); }
.bar > i.up { background: var(--lime); box-shadow: 0 0 10px var(--lime); }

/* ── stage */
.stage { position: absolute; inset: 0; }
.stage canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.stage.grab canvas { cursor: grab; }
.stage.grab canvas:active { cursor: grabbing; }

/* ── HOME */
.home-hero { position: relative; display: grid; grid-template-columns: minmax(340px, 0.9fr) 1.3fr; min-height: min(62vh, 620px); border-radius: var(--r-lg); overflow: hidden; background: radial-gradient(120% 120% at 70% 30%, rgba(255,46,136,0.28), transparent 50%), radial-gradient(90% 90% at 100% 100%, rgba(34,211,238,0.22), transparent 55%), linear-gradient(135deg, rgba(40,20,100,0.85), rgba(14,8,40,0.9)); border: 1px solid var(--line2); box-shadow: 0 40px 90px -40px rgba(255,46,136,0.55); }
.home-hero .hh-grid { position: absolute; inset: auto 0 0 0; height: 45%; background-image: linear-gradient(rgba(255,46,136,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.3) 1px, transparent 1px); background-size: 60px 60px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom; mask-image: linear-gradient(transparent, #000 70%); animation: gridmove 2.4s linear infinite; opacity: 0.55; }
@keyframes gridmove { to { background-position: 0 60px, 0 0; } }
.hh-left { position: relative; z-index: 2; padding: 40px 0 36px 44px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.hh-title { font-size: clamp(66px, 8.2vw, 132px); margin: 0; filter: drop-shadow(0 10px 40px rgba(255,46,136,0.45)); }
.hh-car { font-size: 15px; color: var(--muted); }
.hh-car b { color: #fff; font-size: 22px; font-family: var(--display); font-stretch: 75%; font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; }
.hh-modes { display: flex; gap: 10px; flex-wrap: wrap; }
.hh-right { position: relative; min-height: 340px; }
.hh-chip { position: absolute; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(14,8,40,0.65); border: 1px solid var(--line2); backdrop-filter: blur(10px); font-size: 12px; animation: float 4s ease-in-out infinite; }
.hh-chip b { display: block; font-size: 18px; font-family: var(--display); font-stretch: 75%; font-style: italic; font-weight: 900; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.home-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; margin-top: 20px; }
.span3 { grid-column: span 3; } .span4 { grid-column: span 4; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span7 { grid-column: span 7; } .span8 { grid-column: span 8; } .span12 { grid-column: span 12; }
.event-art { position: relative; border-radius: 14px; overflow: hidden; min-height: 120px; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; }
.event-art::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 22px); pointer-events: none; }
.event-art h4 { margin: 0; font-size: 30px; position: relative; z-index: 1; }
.mini-mission { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini-mission:last-child { border-bottom: 0; }
.mm-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(34,211,238,0.14); color: var(--cyan); flex: none; }
.mm-icon.done { background: var(--lime); color: #0e2a05; }
.login-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.ls-day { border-radius: 10px; padding: 8px 4px; text-align: center; background: rgba(0,0,0,0.25); border: 1px solid var(--line); font-size: 10px; font-weight: 800; color: var(--muted); }
.ls-day.done { background: rgba(163,230,53,0.15); color: var(--lime); border-color: rgba(163,230,53,0.35); }
.ls-day.today { background: var(--grad-gold); color: #3a2200; border-color: transparent; box-shadow: 0 0 18px rgba(255,201,60,0.6); animation: pulse 2s infinite; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lb-row:last-child { border-bottom: 0; }
.lb-rank { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; font-size: 13px; background: rgba(255,255,255,0.08); flex: none; }
.lb-rank.r1 { background: var(--grad-gold); color: #3a2200; } .lb-rank.r2 { background: linear-gradient(135deg, #f1f5f9, #94a3b8); color: #1e293b; } .lb-rank.r3 { background: linear-gradient(135deg, #fdba74, #c2410c); color: #2a1000; }
.lb-row.me { background: rgba(34,211,238,0.08); border-radius: 10px; padding-left: 8px; padding-right: 8px; }
.news-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.news-item:last-child { border-bottom: 0; }
.news-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.garage-mini { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.gm-car { flex: none; width: 150px; border-radius: 14px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); padding: 8px 10px 10px; text-align: left; transition: border-color .2s, transform .2s var(--ease); }
.gm-car:hover { transform: translateY(-3px); border-color: var(--line2); }
.gm-car.on { border-color: var(--cyan); box-shadow: 0 0 20px -6px var(--cyan); }
.big-num { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 44px; line-height: 1; }

/* ── garage */
.garage { display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
.garage-stage { position: relative; min-height: 460px; border-radius: var(--r-lg); overflow: hidden; background: radial-gradient(80% 70% at 50% 85%, rgba(34,211,238,0.25), transparent 60%), radial-gradient(70% 60% at 20% 10%, rgba(255,46,136,0.25), transparent 60%), linear-gradient(160deg, rgba(40,20,100,0.75), rgba(12,6,34,0.85)); border: 1px solid var(--line2); }
.garage-info { position: absolute; left: 28px; top: 22px; z-index: 2; pointer-events: none; }
.garage-info h1 { font-size: clamp(42px, 5vw, 78px); margin: 6px 0 4px; }
.car-strip { display: flex; gap: 10px; overflow-x: auto; padding: 16px 2px 6px; }
.car-card { position: relative; flex: none; width: 170px; padding: 10px 12px 12px; border-radius: 16px; background: linear-gradient(160deg, rgba(48,28,110,0.6), rgba(20,12,52,0.7)); border: 1px solid var(--line); text-align: left; transition: border-color .2s, transform .25s var(--ease), box-shadow .25s; }
.car-card:hover { transform: translateY(-4px); border-color: var(--line2); }
.car-card.on { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 14px 30px -12px var(--pink); }
.car-card .n { font-weight: 800; font-size: 13px; }
.car-card .s { font-size: 11px; color: var(--muted); }
.car-card .lock { position: absolute; top: 8px; right: 8px; }
.class-badge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 17px; color: #140a30; background: var(--grad-gold); }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.swatch { position: relative; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; padding: 3px; background: none; transition: transform .2s var(--spring); }
.swatch:hover { transform: scale(1.1); }
.swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,0.35), inset 0 4px 8px rgba(255,255,255,0.3); }
.swatch.on { border-color: #fff; box-shadow: 0 0 14px rgba(255,255,255,0.4); }
.swatch .p { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 800; background: #140a30; padding: 0 4px; border-radius: 4px; color: var(--gold); white-space: nowrap; }
.swatch .lk { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,0.8); }

/* ── upgrades */
.up-track { padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.22); border: 1px solid var(--line); }
.up-pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0 12px; }
.up-pips i { height: 10px; border-radius: 4px; background: rgba(255,255,255,0.1); transition: background .3s, box-shadow .3s; }
.up-pips i.on { background: var(--c); box-shadow: 0 0 12px var(--c); }

/* ── shop / inventory tiles */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.shop-tile { display: flex; flex-direction: column; gap: 10px; }
.shop-tile .art { height: 130px; border-radius: 14px; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, var(--glow, rgba(255,46,136,0.35)), transparent 70%), rgba(0,0,0,0.2); }
.price { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; color: var(--gold); }
.price s { color: var(--dim); font-size: 12px; font-weight: 600; }
.deal { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: center; }
.deal .deal-art { position: relative; height: 230px; }
.ribbon { position: absolute; top: 16px; right: -36px; transform: rotate(35deg); background: var(--grad-hot); padding: 4px 44px; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; z-index: 3; }

/* ── missions */
.mission { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.22); border: 1px solid var(--line); transition: border-color .2s, transform .2s var(--ease); }
.mission:hover { border-color: var(--line2); }
.mission.done { border-color: rgba(163,230,53,0.45); box-shadow: inset 0 0 30px -12px rgba(163,230,53,0.5); }
.mission.claimed { opacity: 0.55; }
.mission .mi { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: rgba(34,211,238,0.14); color: var(--cyan); }
.mission.done .mi { background: var(--grad-lime); color: #0e2a05; }
.mission h4 { margin: 0 0 6px; font-size: 16px; }
.ring { position: relative; width: 120px; height: 120px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }

.missions-grid { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .missions-grid { grid-template-columns: 1fr; } }

/* ── rewards */
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.cal-day { position: relative; border-radius: 18px; padding: 16px 10px; text-align: center; background: rgba(0,0,0,0.25); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 160px; justify-content: space-between; }
.cal-day .dn { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); }
.cal-day.done { background: rgba(163,230,53,0.1); border-color: rgba(163,230,53,0.35); }
.cal-day.today { background: linear-gradient(160deg, rgba(255,201,60,0.3), rgba(255,46,136,0.2)); border-color: var(--gold); box-shadow: 0 0 30px -8px var(--gold); }
.cal-day.big { grid-column: span 1; background: linear-gradient(160deg, rgba(176,107,255,0.3), rgba(255,46,136,0.15)); }
.cal-check { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); color: #0e2a05; display: grid; place-items: center; }
.ach { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: rgba(0,0,0,0.22); border: 1px solid var(--line); }
.ach .ai { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(176,107,255,0.18); color: var(--purple); flex: none; }
.ach.ready { border-color: rgba(255,201,60,0.5); box-shadow: inset 0 0 30px -12px rgba(255,201,60,0.5); }
.ach.ready .ai { background: var(--grad-gold); color: #3a2200; }
.ach.got .ai { background: var(--grad-lime); color: #0e2a05; }
.ach.got { opacity: 0.7; }

/* ── events */
.event-hero { position: relative; border-radius: var(--r-lg); overflow: hidden; padding: 36px; min-height: 320px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; border: 1px solid var(--line2); }
.event-hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 28px); }
.event-hero > * { position: relative; z-index: 1; }
.event-hero h2 { font-size: clamp(50px, 6vw, 92px); margin: 8px 0; text-shadow: 0 8px 40px rgba(0,0,0,0.5); }
.rules { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.rules span { padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 700; }
.goal { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); }
.goal + .goal { margin-top: 10px; }
.goal .gi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.12); flex: none; font-weight: 900; }
.goal.done .gi { background: var(--lime); color: #0e2a05; }

/* ── battle pass */
.pass-head { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; }
.pass-tier-big { width: 120px; height: 120px; border-radius: 28px; display: grid; place-items: center; background: var(--grad-hot); box-shadow: 0 20px 50px -14px rgba(255,46,136,0.8); text-align: center; }
.pass-track { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 12px; overflow-x: auto; padding: 8px 4px 16px; scroll-snap-type: x proximity; }
.pass-col { scroll-snap-align: start; display: grid; grid-template-rows: auto 1fr 1fr; gap: 10px; }
.pass-num { text-align: center; font-weight: 900; font-size: 13px; padding: 6px; border-radius: 10px; background: rgba(255,255,255,0.06); }
.pass-num.reached { background: var(--grad-hot); }
.pass-cell { position: relative; border-radius: 16px; padding: 12px 10px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; text-align: center; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
.pass-cell.ready { border-color: var(--gold); box-shadow: 0 0 24px -8px var(--gold); background: linear-gradient(160deg, rgba(255,201,60,0.18), rgba(0,0,0,0.25)); }
.pass-cell.got { opacity: 0.55; }
.pass-cell.prem { background: linear-gradient(160deg, rgba(176,107,255,0.18), rgba(0,0,0,0.3)); border-style: dashed; }
.pass-cell .ico { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,0.06); }
.pass-lock { position: absolute; top: 6px; right: 6px; color: var(--dim); }

/* ── leaderboard */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; margin-bottom: 18px; }
.pod { text-align: center; border-radius: 18px 18px 12px 12px; padding: 18px 10px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
.pod.p1 { padding-top: 30px; background: linear-gradient(180deg, rgba(255,201,60,0.28), rgba(0,0,0,0.25)); border-color: rgba(255,201,60,0.5); }
.pod.p2 { background: linear-gradient(180deg, rgba(203,213,225,0.2), rgba(0,0,0,0.25)); }
.pod.p3 { background: linear-gradient(180deg, rgba(251,146,60,0.22), rgba(0,0,0,0.25)); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl tr.me td { background: rgba(34,211,238,0.1); }
.tbl tr:last-child td { border-bottom: 0; }
.pos { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 22px; }
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.rung { padding: 16px 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); text-align: center; }
.rung.on { border-color: var(--line2); background: rgba(255,255,255,0.08); box-shadow: 0 0 30px -10px rgba(255,255,255,0.4); }
.rung.locked { opacity: 0.45; }

/* ── maps / play */
.maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.map-card { position: relative; text-align: left; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: rgba(20,12,52,0.7); padding: 0; transition: transform .3s var(--ease), border-color .2s, box-shadow .3s; }
.map-card:hover:not(:disabled) { transform: translateY(-5px); border-color: var(--line2); }
.map-card.on { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange), 0 20px 50px -20px var(--orange); }
.map-card .body { padding: 14px 16px 16px; }
.map-card h3 { font-size: 30px; margin: 0 0 2px; }
.map-card:disabled { cursor: not-allowed; }
.map-card:disabled canvas { filter: grayscale(0.8) brightness(0.5); }
.map-card .lockover { position: absolute; top: 12px; left: 12px; }
.mode-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.mode-tab { text-align: left; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(48,28,110,0.55), rgba(20,12,52,0.65)); transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; display: flex; gap: 12px; align-items: center; }
.mode-tab:hover { transform: translateY(-3px); }
.mode-tab.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc), 0 16px 40px -18px var(--acc); }
.mode-tab .mt-i { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--acc); color: #140a30; flex: none; box-shadow: 0 0 18px var(--acc); }
.booster-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.bp { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); transition: border-color .2s, background .2s; }
.bp.on { border-color: var(--lime); background: rgba(163,230,53,0.12); }
.bp:disabled { opacity: 0.4; cursor: not-allowed; }
.start-bar { position: sticky; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 16px 20px; border-radius: 22px; background: rgba(14,8,40,0.85); border: 1px solid var(--line2); backdrop-filter: blur(18px); box-shadow: 0 20px 60px -20px rgba(0,0,0,0.8); margin-top: 20px; }

/* ── race */
.race { position: fixed; inset: 0; background: #000; z-index: 50; user-select: none; -webkit-user-select: none; touch-action: none; }
.race canvas.view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.hud-tl { position: absolute; left: 22px; top: 18px; display: flex; gap: 14px; align-items: stretch; }
.hud-box { padding: 10px 16px; border-radius: 16px; background: linear-gradient(160deg, rgba(20,10,52,0.72), rgba(10,6,32,0.6)); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(8px); }
.hud-box .k { font-size: 10px; font-weight: 800; letter-spacing: 0.2em; color: rgba(255,255,255,0.6); text-transform: uppercase; }
.hud-box .v { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 42px; line-height: 1; }
.hud-box .v small { font-size: 22px; color: rgba(255,255,255,0.55); }
.hud-box.pos .v { background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hud-times { font-size: 13px; line-height: 1.7; }
.hud-times b { display: inline-block; width: 44px; color: rgba(255,255,255,0.5); font-weight: 800; font-size: 10px; letter-spacing: 0.14em; }
.hud-gap { font-size: 12px; color: var(--cyan); font-weight: 700; margin-top: 2px; }
.gauge { position: absolute; right: 22px; bottom: 18px; width: 250px; height: 250px; }
.gauge svg { width: 100%; height: 100%; overflow: visible; }
.gauge .gv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 14px; }
.gauge .gv .sp { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 78px; line-height: 0.9; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
.gauge .gv .un { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: rgba(255,255,255,0.6); }
.gauge .gv .gear { margin-top: 6px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
.nitro-bar { position: absolute; right: 290px; bottom: 34px; width: 22px; height: 170px; border-radius: 12px; background: rgba(10,6,32,0.6); border: 1px solid rgba(255,255,255,0.16); overflow: hidden; }
.nitro-bar i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #6366f1, #22d3ee, #a5f3fc); box-shadow: 0 0 20px #22d3ee; }
.nitro-bar.boost { box-shadow: 0 0 30px #22d3ee; }
.nitro-label { position: absolute; right: 284px; bottom: 210px; font-size: 10px; font-weight: 900; letter-spacing: 0.16em; color: var(--cyan); }
.minimap { position: absolute; right: 22px; top: 70px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(20,10,52,0.65), rgba(10,6,32,0.35)); border: 1px solid rgba(255,255,255,0.12); }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; }
.countdown .n { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 200px; line-height: 1; background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 40px rgba(255,46,136,0.6)); animation: pop .9s var(--ease) both; }
.countdown .hint { text-align: center; font-weight: 800; letter-spacing: 0.12em; font-size: 13px; color: rgba(255,255,255,0.8); text-transform: uppercase; }
@keyframes pop { 0% { transform: scale(1.8); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: 0.9; } }
.lights { display: flex; gap: 14px; justify-content: center; margin-bottom: 10px; padding: 10px 16px; border-radius: 18px; background: rgba(10,6,32,0.6); width: max-content; margin-inline: auto; }
.lights i { width: 26px; height: 26px; border-radius: 50%; background: #2a0a12; border: 2px solid rgba(0,0,0,0.6); }
.lights i.on { background: #ff2a3d; box-shadow: 0 0 22px #ff2a3d; }
.lights.go i { background: #3dff8a; box-shadow: 0 0 22px #3dff8a; }
.feed { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.feed-item { text-align: center; animation: feedIn 1.6s var(--ease) both; }
.feed-item .ft { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 54px; line-height: 1; text-transform: uppercase; filter: drop-shadow(0 6px 24px rgba(0,0,0,0.7)); }
.feed-item .fs { font-weight: 800; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.feed-item.overtake .ft { color: var(--lime); } .feed-item.perfect .ft { background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.feed-item.nearmiss .ft { color: var(--cyan); font-size: 40px; } .feed-item.early .ft { color: var(--red); } .feed-item.lap .ft, .feed-item.finallap .ft { color: #fff; }
.feed-item.finish .ft { font-size: 110px; background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
.feed-item.lost .ft { color: var(--red); font-size: 34px; }
@keyframes feedIn { 0% { opacity: 0; transform: scale(1.6) translateY(10px); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
.pause-btn { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); pointer-events: auto; width: 46px; height: 46px; border-radius: 14px; background: rgba(10,6,32,0.6); border: 1px solid rgba(255,255,255,0.18); display: grid; place-items: center; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,3,20,0.72); backdrop-filter: blur(12px); z-index: 5; animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } }
.overlay .box { width: min(440px, calc(100% - 40px)); padding: 30px; }
.touch { position: absolute; inset: auto 0 0 0; height: 46%; pointer-events: none; display: none; }
.touch.show { display: block; }
.tbtn { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(20,10,52,0.45); border: 2px solid rgba(255,255,255,0.22); display: grid; place-items: center; backdrop-filter: blur(6px); touch-action: none; transition: transform .1s, background .1s; }
.tbtn.on { background: rgba(255,46,136,0.45); transform: scale(0.94); border-color: var(--pink); }
.tbtn.nitro { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 20px rgba(34,211,238,0.4); }
.tbtn svg { width: 30px; height: 30px; }
.rotate-hint { display: none; position: fixed; left: 50%; top: 96px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15); font-size: 12px; white-space: nowrap; pointer-events: none; animation: hintOut 5s forwards; }
@keyframes hintOut { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@media (orientation: portrait) { .touch.show .rotate-hint { display: block; } }

/* ── results */
.res-hero { position: relative; border-radius: var(--r-lg); padding: 34px; overflow: hidden; display: grid; grid-template-columns: auto 1fr auto; gap: 30px; align-items: center; background: radial-gradient(80% 120% at 0% 0%, rgba(255,201,60,0.3), transparent 55%), radial-gradient(80% 120% at 100% 100%, rgba(255,46,136,0.3), transparent 55%), linear-gradient(135deg, rgba(40,20,100,0.85), rgba(14,8,40,0.9)); border: 1px solid var(--line2); }
.res-pos { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 180px; line-height: 0.8; }
.res-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-top: 18px; }
.reward-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.reward-row:last-child { border-bottom: 0; }
.reward-row b { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 30px; }
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(163,230,53,0.1); border: 1px solid rgba(163,230,53,0.3); font-size: 13px; font-weight: 600; }
.notice + .notice { margin-top: 8px; }
.notice.violet { background: rgba(176,107,255,0.12); border-color: rgba(176,107,255,0.35); }
.notice.gold { background: rgba(255,201,60,0.12); border-color: rgba(255,201,60,0.35); }

/* ── modal / popups */
.modal-back { position: fixed; inset: 0; z-index: 210; background: rgba(6,3,20,0.72); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 16px; animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 28px; border-radius: var(--r-lg); background: linear-gradient(160deg, #241458, #120a33); border: 1px solid var(--line2); box-shadow: 0 40px 100px -30px rgba(0,0,0,0.9); animation: modalIn .45s var(--spring) both; }
.modal.wide { width: min(920px, 100%); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } }
.modal-x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); display: grid; place-items: center; z-index: 2; }
.popup { text-align: center; }
.popup .burst { position: relative; width: 160px; height: 160px; margin: 0 auto 10px; display: grid; place-items: center; }
.popup .burst::before { content: ''; position: absolute; inset: -30px; background: conic-gradient(from 0deg, transparent 0 10deg, rgba(255,201,60,0.35) 10deg 20deg, transparent 20deg 40deg, rgba(255,46,136,0.3) 40deg 50deg, transparent 50deg 70deg, rgba(34,211,238,0.3) 70deg 80deg, transparent 80deg 100deg, rgba(255,201,60,0.35) 100deg 110deg, transparent 110deg 130deg, rgba(176,107,255,0.3) 130deg 140deg, transparent 140deg 160deg, rgba(255,201,60,0.35) 160deg 170deg, transparent 170deg 190deg, rgba(255,46,136,0.3) 190deg 200deg, transparent 200deg 220deg, rgba(34,211,238,0.3) 220deg 230deg, transparent 230deg 250deg, rgba(255,201,60,0.35) 250deg 260deg, transparent 260deg 280deg, rgba(176,107,255,0.3) 280deg 290deg, transparent 290deg 310deg, rgba(255,201,60,0.35) 310deg 320deg, transparent 320deg 340deg, rgba(255,46,136,0.3) 340deg 350deg, transparent 350deg); border-radius: 50%; animation: spin 8s linear infinite; mask-image: radial-gradient(circle, #000 30%, transparent 70%); }
@keyframes spin { to { transform: rotate(360deg); } }
.popup .items { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0 20px; }
.popup .item { min-width: 110px; padding: 14px 12px; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--line2); animation: rise .5s var(--spring) both; }
.popup .item b { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 900; font-style: italic; font-size: 26px; }
.crate-stage { position: relative; height: 220px; display: grid; place-items: center; }
.crate-stage .flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 60%); animation: flashOut .8s forwards; }
@keyframes flashOut { from { opacity: 1; transform: scale(0.4); } to { opacity: 0; transform: scale(1.6); } }

.toast { position: fixed; z-index: 300; left: 50%; top: 84px; transform: translateX(-50%); padding: 12px 18px; border-radius: 14px; background: linear-gradient(160deg, #2a1764, #16093e); border: 1px solid var(--line2); font-size: 14px; font-weight: 600; animation: toastIn .45s var(--spring) both; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.9); max-width: calc(100% - 32px); }
.toast.ok { border-color: rgba(163,230,53,0.5); } .toast.warn { border-color: rgba(255,159,28,0.6); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px) scale(0.96); } }

/* ── welcome */
.welcome-cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
.wc { text-align: left; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); transition: border-color .2s, transform .2s var(--ease); }
.wc:hover { transform: translateY(-3px); }
.wc.on { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 14px 30px -12px var(--pink); }

/* ── legal */
.legal { display: grid; grid-template-columns: 260px 1fr; gap: 32px; }
.legal-nav { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.legal-nav button { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-size: 14px; }
.legal-nav button.on { background: rgba(255,255,255,0.08); color: var(--text); }
.doc { max-width: 780px; }
.doc h1 { font-size: 52px; margin: 8px 0 6px; }
.doc h2 { font-size: 18px; margin: 32px 0 8px; }
.doc p, .doc li { color: #d6d0f0; }
.doc ul { padding-left: 20px; }
.draft-box { border: 1px solid rgba(255,77,94,0.35); background: rgba(255,77,94,0.08); padding: 14px 16px; border-radius: 12px; font-size: 13px; color: #ffc2c8; margin: 16px 0 8px; }
.ph { background: rgba(255,159,28,0.14); color: var(--orange); padding: 1px 6px; border-radius: 4px; font-size: 0.92em; }
.legal-links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 18px; }
.legal-links button { background: none; border: 0; padding: 0; color: var(--dim); font-size: 12px; }
.legal-links button:hover { color: var(--text); }
.note { font-size: 13px; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px; }

/* ── cookie */
.cookie { position: fixed; z-index: 260; left: 50%; bottom: calc(20px + var(--safe-b)); transform: translateX(-50%); width: min(900px, calc(100% - 24px)); padding: 18px 22px; display: flex; gap: 22px; align-items: center; animation: slideUp .5s var(--ease) both; background: linear-gradient(160deg, rgba(36,20,88,0.97), rgba(18,10,51,0.97)); border: 1px solid var(--line2); border-radius: 20px; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } }
.cookie p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.cookie .acts { display: flex; gap: 8px; flex: none; }

/* ── multiplayer */
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); display: inline-block; }
.mp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.slot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); min-height: 64px; }
.slot.empty { border-style: dashed; color: var(--dim); justify-content: center; }
.code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 26px; letter-spacing: 0.25em; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.league-badge { display: inline-flex; align-items: center; gap: 10px; }

/* ── responsive */
@media (max-width: 1280px) {
  .span3 { grid-column: span 6; } .span4 { grid-column: span 6; } .span5 { grid-column: span 12; } .span7 { grid-column: span 12; } .span8 { grid-column: span 12; }
  .mode-tabs { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1100px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  .side { display: none; }
  .bottomnav { display: flex; position: relative; z-index: 20; height: calc(66px + var(--safe-b)); padding-bottom: var(--safe-b); border-top: 1px solid var(--line); background: rgba(12,7,36,0.95); backdrop-filter: blur(16px); }
  .bottomnav button { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: 0.03em; }
  .bottomnav button.on { color: #fff; }
  .bottomnav button.on svg { color: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
  .bottomnav button.play-fab { flex: none; width: 74px; }
  .bottomnav .fab { width: 54px; height: 54px; margin-top: -26px; border-radius: 18px; display: grid; place-items: center; background: var(--grad-hot); color: #fff; box-shadow: 0 10px 30px -6px rgba(255,46,136,0.9); }
  .bottomnav .bn-badge { position: absolute; top: 8px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
  .more-sheet { display: block; position: fixed; inset: 0; z-index: 150; background: rgba(6,3,20,0.6); backdrop-filter: blur(8px); animation: fade .2s both; }
  .more-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(18px + var(--safe-b)); border-radius: 24px 24px 0 0; background: linear-gradient(180deg, #241458, #120a33); border-top: 1px solid var(--line2); animation: sheetUp .35s var(--ease) both; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .more-panel button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-size: 12px; font-weight: 700; }
  .more-panel .ni-icon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--acc); color: #140a30; }
  .more-panel .badge { position: absolute; top: 6px; right: 6px; }
  .home-hero { grid-template-columns: 1fr; }
  .hh-left { padding: 28px 24px 0; }
  .hh-right { min-height: 300px; }
  .garage { grid-template-columns: 1fr; }
  .garage-stage { min-height: 360px; }
  .res-grid, .deal, .event-hero { grid-template-columns: 1fr; }
  .mp-grid { grid-template-columns: 1fr; }
  .calendar { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 760px) {
  body { font-size: 14px; }
  .topbar { height: 60px; padding: 0 12px; gap: 8px; }
  .xpbar { width: 80px; }
  .player-chip .pc-name { font-size: 13px; }
  .res { height: 34px; font-size: 13px; padding: 0 10px 0 6px; }
  .res.hide-m, .hide-m { display: none !important; }
  .page { padding: 18px 14px 40px; }
  .home-grid { gap: 12px; }
  .span3, .span4, .span6 { grid-column: span 12; }
  .hh-title { font-size: 64px; }
  .btn.xl { height: 64px; font-size: 28px; padding: 0 30px; width: 100%; }
  .hh-chip { display: none; }
  .section-head h1 { font-size: 40px; }
  .sh-icon { width: 46px; height: 46px; border-radius: 14px; }
  .maps, .welcome-cars { grid-template-columns: 1fr; }
  .mode-tabs { grid-template-columns: 1fr 1fr; }
  .ladder { grid-template-columns: repeat(3, 1fr); }
  .legal { grid-template-columns: 1fr; }
  .legal-nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .legal-nav button { white-space: nowrap; flex: none; }
  .cookie { flex-direction: column; align-items: stretch; gap: 14px; }
  .cookie .acts { flex-direction: column; }
  .calendar { grid-template-columns: repeat(3, 1fr); }
  .res-hero { grid-template-columns: 1fr; text-align: center; padding: 22px; }
  .res-pos { font-size: 120px; }
  .pass-head { grid-template-columns: 1fr; }
  .podium { gap: 8px; }
  .mission { grid-template-columns: auto 1fr; }
  .mission > :last-child { grid-column: 1 / 3; }
  .event-hero { padding: 22px; }
}
@media (max-width: 760px), (max-height: 520px) {
  .hud-tl { left: 12px; top: 10px; gap: 8px; }
  .hud-box { padding: 6px 10px; border-radius: 12px; }
  .hud-box .v { font-size: 28px; }
  .hud-times { display: none; }
  .gauge { width: 150px; height: 150px; right: 12px; bottom: auto; top: 6px; }
  .gauge .gv .sp { font-size: 44px; } .gauge .gv .gear { display: none; }
  .nitro-bar { right: auto; left: 12px; top: 84px; bottom: auto; height: 110px; width: 14px; }
  .nitro-label { display: none; }
  .minimap { display: none; }
  .pause-btn { top: 10px; }
  .countdown .n { font-size: 130px; }
  .feed-item .ft { font-size: 36px; } .feed-item.finish .ft { font-size: 70px; }
}
@media (prefers-reduced-motion: reduce) { .screen, .stagger > *, .countdown .n, .toast, .cookie, .hh-chip, .home-hero .hh-grid, .badge, .btn.shine::after, .popup .burst::before { animation: none !important; } }
@media (max-height: 700px), (max-width: 760px) { .start-bar { position: static; } }
@media (max-width: 760px) { .start-bar .btn.xl { width: 100%; } }
