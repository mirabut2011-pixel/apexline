  --display: 'Apex Display', 'Arial Narrow', sans-serif; --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.display { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; letter-spacing: 0.01em; line-height: 0.95; text-transform: uppercase; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ── app shell */
.app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); display: flex; flex-direction: column; background: radial-gradient(1200px 700px at 70% 10%, #121725 0%, var(--bg) 60%); }
.topbar { position: relative; z-index: 20; display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(7,8,11,0.6); backdrop-filter: blur(14px); }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.logo-mark { width: 26px; height: 26px; }
.logo-word { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 0.04em; }
.nav { display: flex; gap: 4px; margin-left: 12px; }
.nav button { position: relative; background: none; border: 0; padding: 8px 14px; color: var(--muted); font-weight: 500; font-size: 14px; border-radius: 8px; transition: color .2s; }
.nav button:hover { color: var(--text); }
.nav button.on { color: var(--text); }
.nav button.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -13px; height: 2px; background: var(--accent); border-radius: 2px; }
.topbar .spacer { flex: 1; }
.wallet { display: flex; align-items: center; gap: 18px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.avatar-btn { display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 3px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #1e2533, #0f1218); font-weight: 700; font-size: 12px; border: 1px solid var(--line2); }
.main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; animation: screenIn .5s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page { max-width: 1240px; margin: 0 auto; padding: 36px 28px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(38px, 5vw, 60px); margin: 6px 0 0; }

.bottomnav { display: none; }

/* ── buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 46px; padding: 0 22px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: rgba(255,255,255,0.04); font-weight: 600; font-size: 14px; letter-spacing: 0.01em; transition: transform .15s var(--ease), background .2s, border-color .2s, opacity .2s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--text); color: #07080b; border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.accent:hover:not(:disabled) { background: #6be9ff; }
.btn.danger { border-color: rgba(255,77,94,0.5); color: #ff8c97; }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.04); }
.btn.lg { height: 58px; padding: 0 30px; font-size: 16px; }
.btn.block { width: 100%; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
.btn-race { height: 68px; padding: 0 44px; border-radius: 12px; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border: 0; box-shadow: 0 10px 40px -10px rgba(55,226,255,0.55); }
.btn-race:hover:not(:disabled) { background: #6be9ff; }
.btn-race:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

.tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.06); color: var(--muted); }
.tag.demo { background: rgba(180,140,255,0.14); color: var(--demo); }
.tag.soon { background: rgba(255,179,71,0.12); color: var(--warm); }
.tag.ok { background: rgba(78,227,154,0.12); color: var(--ok); }
.tag.ai { background: rgba(255,255,255,0.08); color: #c9cfda; }
.tag.draft { background: rgba(255,77,94,0.12); color: #ff8c97; }

/* ── panels/cards */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(18px); }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.grid { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

/* ── forms */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em; }
.input { width: 100%; height: 46px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: rgba(0,0,0,0.35); outline: none; transition: border-color .2s; }
.input:focus { border-color: var(--accent); }
textarea.input { height: 120px; padding: 12px 14px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 10px 0; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.err { color: #ff8c97; font-size: 13px; margin: 8px 0; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
.seg button { background: none; border: 0; height: 36px; padding: 0 16px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 13px; transition: background .2s, color .2s; }
.seg button.on { background: rgba(255,255,255,0.1); color: var(--text); }

.switch { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: rgba(255,255,255,0.12); border: 0; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(18px); }
.switch:disabled { opacity: 0.55; cursor: not-allowed; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .t { font-weight: 600; }
.setting .d { font-size: 13px; color: var(--muted); }

/* ── stat bars */
.stat { margin: 10px 0; }
.stat .l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.stat .l b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--text); border-radius: 4px; transition: width .6s var(--ease); }
.bar > i.up { background: var(--accent); }
.bar.xp > i { background: linear-gradient(90deg, #9aa4b5, #fff); }

/* ── boot */
.boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
.boot p { max-width: 360px; font-size: 14px; margin: 0; }
.boot-bar { width: 180px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; position: relative; }
.boot-bar i { position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--accent); animation: bootbar 1.2s ease-in-out infinite; }
@keyframes bootbar { 0% { left: -40%; } 100% { left: 100%; } }

/* ── auth */
.auth { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr minmax(380px, 480px); }
.auth-side { position: relative; z-index: 2; display: flex; flex-direction: column; padding: 40px 44px; background: rgba(7,8,11,0.94); border-left: 1px solid var(--line); overflow-y: auto; }
.auth-hero { position: relative; overflow: hidden; }
.auth-hero .claim { position: absolute; left: 48px; bottom: 56px; max-width: 560px; pointer-events: none; }
.auth-hero .claim h2 { font-size: clamp(48px, 6vw, 92px); margin: 8px 0 12px; }
.auth h1 { font-size: 40px; margin: 40px 0 6px; }
.legal-links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: auto; padding-top: 28px; }
.legal-links button { background: none; border: 0; padding: 0; color: var(--dim); font-size: 12px; }
.legal-links button:hover { color: var(--text); }
.note { font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.03); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; }

/* ── stage */
.stage { position: absolute; inset: 0; }
.stage canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.stage.grab canvas { cursor: grab; }
.stage.grab canvas:active { cursor: grabbing; }

/* ── home */
.home { position: absolute; inset: 0; }
.home-overlay { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; padding: 36px 40px 32px; pointer-events: none; }
.home-overlay > * { pointer-events: auto; }
.home-title { align-self: start; }
.home-title h1 { font-size: clamp(52px, 7vw, 110px); margin: 8px 0 0; }
.home-title .sub { color: var(--muted); margin-top: 10px; }
.home-side { grid-row: 1 / 3; grid-column: 2; align-self: start; width: 300px; padding: 20px; }
.home-actions { grid-column: 1; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(120px, 160px)); gap: 10px; }
.tile { text-align: left; padding: 14px 16px; height: 68px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); transition: border-color .2s, transform .2s var(--ease); display: flex; flex-direction: column; justify-content: center; }
.tile:hover { border-color: rgba(255,255,255,0.22); transform: translateY(-2px); }
.tile b { font-size: 14px; }
.tile small { font-size: 12px; color: var(--muted); }
.league-badge { display: inline-flex; align-items: center; gap: 10px; }
.league-badge .gem { width: 34px; height: 34px; }

/* ── garage */
.garage { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; }
.garage-stage { position: relative; grid-row: 1; grid-column: 1; }
.garage-info { position: absolute; left: 40px; top: 32px; pointer-events: none; }
.garage-info h1 { font-size: clamp(44px, 6vw, 84px); margin: 4px 0 6px; }
.garage-panel { grid-row: 1 / 3; grid-column: 2; border-left: 1px solid var(--line); background: rgba(9,10,14,0.82); backdrop-filter: blur(18px); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }
.garage-strip { grid-row: 2; grid-column: 1; display: flex; gap: 10px; padding: 14px 24px 20px; overflow-x: auto; scrollbar-width: thin; }
.car-card { position: relative; flex: none; width: 168px; padding: 10px 12px 12px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); text-align: left; transition: border-color .2s, background .2s; }
.car-card:hover { border-color: rgba(255,255,255,0.2); }
.car-card.on { border-color: var(--accent); background: rgba(55,226,255,0.06); }
.car-card canvas { width: 100%; height: 70px; display: block; }
.car-card .n { font-weight: 600; font-size: 13px; }
.car-card .s { font-size: 11px; color: var(--muted); }
.car-card .lock { position: absolute; top: 8px; right: 8px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.swatch { position: relative; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; padding: 3px; background: none; }
.swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,0.35), inset 0 4px 8px rgba(255,255,255,0.25); }
.swatch.on { border-color: var(--text); }
.swatch .p { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 700; background: #000; padding: 0 4px; border-radius: 4px; color: var(--warm); white-space: nowrap; }
.class-badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 16px; border: 1px solid var(--line2); }

/* ── starter */
.starter-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pick { text-align: left; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); transition: border-color .2s, background .2s; }
.pick.on { border-color: var(--accent); background: rgba(55,226,255,0.06); }

/* ── maps */
.maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.map-card { position: relative; text-align: left; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--bg2); padding: 0; transition: transform .25s var(--ease), border-color .2s; }
.map-card:hover:not(:disabled) { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
.map-card.on { border-color: var(--accent); }
.map-card canvas { width: 100%; aspect-ratio: 16/10; display: block; }
.map-card .body { padding: 16px 18px 18px; }
.map-card h3 { font-size: 30px; margin: 0 0 2px; }
.map-card:disabled { cursor: not-allowed; }
.map-card:disabled canvas { filter: grayscale(0.8) brightness(0.5); }
.map-card .lockover { position: absolute; top: 14px; left: 14px; }

/* ── race */
.race { position: fixed; inset: 0; background: #000; z-index: 50; user-select: none; -webkit-user-select: none; touch-action: none; }
.race canvas.view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.hud-tl { position: absolute; left: 24px; top: 20px; display: flex; gap: 26px; align-items: flex-start; }
.hud-block .k { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: rgba(255,255,255,0.55); text-transform: uppercase; }
.hud-block .v { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 40px; line-height: 1; text-shadow: 0 2px 20px rgba(0,0,0,0.6); }
.hud-block .v small { font-size: 22px; color: rgba(255,255,255,0.55); }
.hud-times { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.6; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
.hud-times b { display: inline-block; width: 44px; color: rgba(255,255,255,0.5); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; }
.hud-speed { position: absolute; right: 28px; bottom: 24px; text-align: right; }
.hud-speed .v { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 88px; line-height: 0.9; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
.hud-speed .u { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: rgba(255,255,255,0.6); }
.nitro { width: 220px; height: 6px; border-radius: 6px; background: rgba(255,255,255,0.14); margin: 10px 0 0 auto; overflow: hidden; }
.nitro i { display: block; height: 100%; background: linear-gradient(90deg, #2bb5ff, #7fe8ff); border-radius: 6px; }
.minimap { position: absolute; right: 20px; top: 70px; width: 150px; height: 150px; opacity: 0.95; }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; }
.countdown .n { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 180px; text-shadow: 0 10px 60px rgba(0,0,0,0.7); animation: pop .9s var(--ease) both; }
@keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: 0.85; } }
.lights { display: flex; gap: 14px; justify-content: center; margin-bottom: 10px; }
.lights i { width: 22px; height: 22px; border-radius: 50%; background: #2a0a0e; border: 2px solid rgba(0,0,0,0.6); }
.lights i.on { background: #ff2a3d; box-shadow: 0 0 18px #ff2a3d; }
.lights.go i { background: #3dff8a; box-shadow: 0 0 18px #3dff8a; }
.banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 64px; text-transform: uppercase; text-shadow: 0 6px 40px rgba(0,0,0,0.7); animation: pop .8s var(--ease) both; }
.pause-btn { position: absolute; top: 18px; right: 184px; pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); display: grid; place-items: center; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,5,8,0.7); backdrop-filter: blur(10px); z-index: 5; animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } }
.overlay .box { width: min(420px, calc(100% - 40px)); padding: 28px; }
.touch { position: absolute; inset: auto 0 0 0; height: 46%; pointer-events: none; display: none; }
.touch.show { display: block; }
.tbtn { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); display: grid; place-items: center; backdrop-filter: blur(6px); touch-action: none; }
.tbtn.on { background: rgba(255,255,255,0.22); }
.tbtn svg { width: 28px; height: 28px; opacity: 0.85; }

/* ── results */
.results { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl tr.me td { background: rgba(55,226,255,0.06); }
.tbl tr:last-child td { border-bottom: 0; }
.pos { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 22px; }
.reward { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.reward:last-child { border-bottom: 0; }
.reward b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-style: italic; font-size: 30px; }

/* ── leagues */
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.rung { padding: 16px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); text-align: center; }
.rung.on { border-color: var(--line2); background: rgba(255,255,255,0.05); }
.rung.locked { opacity: 0.45; }

/* ── multiplayer */
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warm); display: inline-block; }
.mp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.slot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); min-height: 64px; }
.slot.empty { border-style: dashed; color: var(--dim); justify-content: center; }
.code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 26px; letter-spacing: 0.25em; font-weight: 700; }

/* ── legal */
.legal { display: grid; grid-template-columns: 260px 1fr; gap: 32px; }
.legal-nav { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.legal-nav button { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; }
.legal-nav button.on { background: rgba(255,255,255,0.06); color: var(--text); }
.doc { max-width: 760px; }
.doc h1 { font-size: 48px; margin: 8px 0 6px; }
.doc h2 { font-size: 18px; margin: 32px 0 8px; }
.doc p, .doc li { color: #c7ccd6; }
.doc ul { padding-left: 20px; }
.draft-box { border: 1px solid rgba(255,77,94,0.35); background: rgba(255,77,94,0.06); padding: 14px 16px; border-radius: 12px; font-size: 13px; color: #ffc2c8; margin: 16px 0 8px; }
.ph { background: rgba(255,179,71,0.12); color: var(--warm); padding: 1px 6px; border-radius: 4px; font-size: 0.92em; }

/* ── cookie banner / modal */
.cookie { position: fixed; z-index: 200; left: 50%; bottom: calc(20px + var(--safe-b)); transform: translateX(-50%); width: min(880px, calc(100% - 24px)); padding: 20px 22px; display: flex; gap: 22px; align-items: center; animation: slideUp .5s var(--ease) both; background: rgba(14,16,21,0.96); }
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } }
.cookie p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.cookie .acts { display: flex; gap: 8px; flex: none; }
.modal-back { position: fixed; inset: 0; z-index: 210; background: rgba(3,4,6,0.7); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 16px; animation: fade .25s both; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 26px; background: #0f1217; }

.toast { position: fixed; z-index: 300; left: 50%; top: 78px; transform: translateX(-50%); padding: 12px 18px; border-radius: 12px; background: #151922; border: 1px solid var(--line2); font-size: 14px; font-weight: 500; animation: toastIn .4s var(--ease) both; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.8); }
.toast.ok { border-color: rgba(78,227,154,0.4); }
.toast.warn { border-color: rgba(255,179,71,0.45); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } }

/* ── responsive */
@media (max-width: 1100px) {
  .nav { display: none; }
  .bottomnav { display: flex; position: relative; z-index: 20; height: calc(62px + var(--safe-b)); padding-bottom: var(--safe-b); border-top: 1px solid var(--line); background: rgba(7,8,11,0.92); backdrop-filter: blur(14px); }
  .bottomnav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--dim); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
  .bottomnav button.on { color: var(--text); }
  .bottomnav svg { width: 22px; height: 22px; }
  .garage { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 46vh) auto auto; overflow-y: auto; display: block; }
  .garage-stage { height: 46vh; min-height: 280px; }
  .garage-panel { border-left: 0; border-top: 1px solid var(--line); }
  .home-side { display: none; }
  .home-overlay { grid-template-columns: 1fr; }
  .results { grid-template-columns: 1fr; }
  .mp-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  body { font-size: 14px; }
  .topbar { height: 56px; padding: 0 14px; gap: 10px; }
  .logo-word { font-size: 20px; }
  .wallet { gap: 8px; }
  .chip { height: 30px; padding: 0 10px; font-size: 12px; }
  .chip.hide-m { display: none; }
  .avatar-btn span.nm { display: none; }
  .avatar-btn { padding: 3px; }
  .page { padding: 22px 16px 60px; }
  .auth { grid-template-columns: 1fr; }
  .auth-hero { position: absolute; inset: 0 0 auto 0; height: 34vh; }
  .auth-hero .claim { display: none; }
  .auth-side { margin-top: 30vh; background: linear-gradient(180deg, rgba(7,8,11,0.4), var(--bg) 60px); border-left: 0; padding: 24px 20px; }
  .auth h1 { margin-top: 8px; font-size: 32px; }
  .home-overlay { padding: 20px 16px 16px; }
  .tiles { grid-template-columns: repeat(2, 1fr); width: 100%; }
  .home-actions { flex-direction: column; align-items: stretch; }
  .btn-race { width: 100%; }
  .garage-info { left: 16px; top: 14px; }
  .garage-strip { padding: 12px 16px; }
  .starter-cards, .maps { grid-template-columns: 1fr; }
  .ladder { grid-template-columns: repeat(3, 1fr); }
  .legal { grid-template-columns: 1fr; }
  .legal-nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .legal-nav button { white-space: nowrap; flex: none; }
  .cookie { flex-direction: column; align-items: stretch; gap: 14px; }
  .cookie .acts { flex-direction: column; }
  .hud-tl { left: 14px; top: 12px; gap: 16px; }
  .hud-block .v { font-size: 30px; }
  .hud-times { display: none; }
  .hud-speed { right: 16px; bottom: auto; top: 12px; }
  .hud-speed .v { font-size: 46px; }
  .nitro { width: 120px; }
  .minimap { display: none; }
  .pause-btn { right: auto; left: 50%; transform: translateX(-50%); top: 12px; }
  .countdown .n { font-size: 120px; }
  .banner { font-size: 42px; }
}
@media (max-height: 520px) {
  .hud-tl { left: 14px; top: 10px; gap: 16px; }
  .hud-block .v { font-size: 30px; }
  .hud-times { display: none; }
  .hud-speed { right: 16px; bottom: auto; top: 10px; }
  .hud-speed .v { font-size: 46px; }
  .nitro { width: 120px; }
  .minimap { display: none; }
  .pause-btn { right: auto; left: 50%; transform: translateX(-50%); top: 10px; }
  .countdown .n { font-size: 110px; }
  .banner { font-size: 40px; top: 18%; }
}
.rotate-hint { display: none; position: absolute; left: 50%; top: 96px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15); font-size: 12px; white-space: nowrap; pointer-events: none; animation: hintOut 5s forwards; }
@keyframes hintOut { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
@media (orientation: portrait) { .touch.show .rotate-hint { display: block; } }
@media (prefers-reduced-motion: reduce) { .screen, .countdown .n, .banner, .toast, .cookie { animation: none !important; } }
